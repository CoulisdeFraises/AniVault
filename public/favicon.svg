<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Fond : dégradé violet de la DA (violet-600 → violet-900) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <!-- Reflet subtil en haut à gauche -->
    <linearGradient id="shine" x1="0" y1="0" x2="0.6" y2="0.6">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi violet (style "app icon") -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Reflet -->
  <rect width="32" height="32" rx="7" fill="url(#shine)"/>

  <!-- Lettre "A" en ambre — couleur accent du projet -->
  <text
    x="16" y="25"
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="800"
    font-size="23"
    fill="#fbbf24"
    text-anchor="middle"
  >A</text>
</svg>
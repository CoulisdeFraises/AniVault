<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Content Security Policy — restreint les origines autorisées.
      • script-src 'self' 'unsafe-inline' : nécessaire pour Vite (HMR dev) et
        les scripts inline générés par le build.
      • connect-src : APIs tierces utilisées par l'app.
      Note : frame-ancestors ne fonctionne pas via meta (nécessite un header HTTP
      côté serveur/CDN). Ajoute `X-Frame-Options: DENY` dans les headers Netlify/Vercel.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src  'self' 'unsafe-inline';
      style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src    https://fonts.gstatic.com data:;
      img-src     'self' data: blob: https:;
      connect-src 'self'
                  https://graphql.anilist.co
                  https://api.jikan.moe
                  https://api.tvmaze.com
                  https://api.themoviedb.org
                  https://*.supabase.co
                  wss://*.supabase.co;
      worker-src  'self' blob:;
    " />

    <title>AniVault — Journal de visionnage</title>

    <!-- ── Favicons ── -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png?v=20260822" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20260822" />
    <link rel="shortcut icon" href="/favicon.ico?v=20260822" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260822" />

    <!-- ── PWA ── -->
    <meta name="apple-mobile-web-app-title" content="AniVault" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1a0a2e" />
    <link rel="manifest" href="/site.webmanifest?v=20260822" />

    <!-- ── Polices ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover : étend le contenu sous le notch/Dynamic Island iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>AniVault — Journal de visionnage</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"  href="/favicon.svg" />
    <link rel="icon" type="image/png"      href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png"      href="/favicon-16x16.png" sizes="16x16" />
    <link rel="icon"                        href="/favicon.ico"       sizes="48x48" />

    <!-- Apple (iOS, macOS Safari) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA / Android Chrome — couleur calée sur bg-violet-950 -->
    <meta name="theme-color" content="#0f0a1e" />

    <!-- iOS Safari : status bar transparente (le fond de l'app passe dessous) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
